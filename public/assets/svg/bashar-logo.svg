<svg width="1400" height="460" viewBox="0 0 1400 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bashar Production LJK</title>
  <desc id="desc">Transparent logo for navbar and photo watermark</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.72" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <g transform="translate(110 300) skewX(-8)">
      <text x="0" y="0" fill="#ffffff" stroke="#111111" stroke-width="10" paint-order="stroke fill" font-family="Arial Black, Impact, sans-serif" font-size="120" font-weight="900" letter-spacing="2">
        BASHAR
      </text>
      <text x="2" y="112" fill="#ffffff" stroke="#111111" stroke-width="8" paint-order="stroke fill" font-family="Arial Black, Impact, sans-serif" font-size="74" font-weight="900" letter-spacing="8">
        PRODUCTION
      </text>
    </g>

    <g transform="translate(860 92)">
      <text x="0" y="240" fill="#ffffff" stroke="#111111" stroke-width="14" paint-order="stroke fill" font-family="Arial Black, Impact, sans-serif" font-size="300" font-weight="900" letter-spacing="-16">
        LJK
      </text>
      <path d="M80 88 L210 86 L208 164 L310 164 L312 236 L208 236 L208 382 L94 382 L94 208 L80 208 Z" fill="none" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" opacity="0.95" />
    </g>
  </g>
</svg>
